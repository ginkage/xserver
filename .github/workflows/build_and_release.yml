name: Build and Release Debian Package

on:
  push:
    branches:
      - 23.2.6
  workflow_dispatch:

jobs:

  build_and_release:
    name: Build and Release Debian Package
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts quilt fakeroot dpkg-dev
          # Pull Xwayland's build-deps straight from debian/control - no deb-src needed.
          sudo apt-get build-dep -y .
          sudo apt-get clean

      - name: Build Debian package
        # The Ubuntu quilt patches are already applied in-tree (.pc/ retained), so the
        # 3.0 (quilt) build is a no-op on top of the fork's commits. Skip lintian.
        run: |
          debuild --no-lintian -us -uc -b
          cp -a ../xwayland_*.deb ./

      - name: Get version
        id: get_version
        run: |
          ver="$(dpkg-parsechangelog --show-field Version)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # git tags cannot contain ':' (epoch) or '+' (local version) - sanitise them.
          echo "tag=$(echo "$ver" | tr ':+~' '---')" >> "$GITHUB_OUTPUT"

      - name: Get commit hash
        id: get_commit_hash
        uses: prompt/actions-commit-hash@v3

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.get_version.outputs.tag }}-${{ steps.get_commit_hash.outputs.short }}
          tag_name: v${{ steps.get_version.outputs.tag }}-${{ steps.get_commit_hash.outputs.short }}
          generate_release_notes: true
          files: |
            ./*.deb
